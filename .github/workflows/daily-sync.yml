name: Daily sync (events + jobs)

on:
  schedule:
    # Daily at 23:00 UTC = 07:00 SGT
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only. Supabase secrets are optional: without them the
      # script still refreshes data/jobs.json, which the site reads as a fallback.
      - name: Verify roles against company careers boards
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/jobs_sync.py

      - name: Sync events from open Luma listings
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/events_sync.py

      - name: Commit refreshed data
        run: |
          git config user.name  "sg-ai-oasis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/jobs_meta.json data/events.json data/events_meta.json
          git diff --cached --quiet || git commit -m "data: daily sync"
          git push
